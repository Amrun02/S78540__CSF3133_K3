        <header>
            <h1>Lab Exercise 2 - Simple Form</h1>
        </header>

        <body>
            <div id="simple-form">
                <h2>User Information Submittion</h2>
                <form action="./lab2.html" method="post">
                    <label for="fname">First Name: </label><br>
                    <input type="text" id="fname" name="firstname"> <br><br>

                    <label for="lname">Last Name: </label><br>
                    <input type="lname" id="lname" name="lastname"><br><br>

                    <label for="gender">Gender: </label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label><br><br>

                    <label for="age">Age: </label>
                    <input type="number" id="age" name="age" step="1"><br><br>

                    <label for="occupation">Occupation: </label>
                    <select id="occupation" name="occupation">
                        <option value="health">Health</option>
                        <option value="education">Education</option>
                        <option value="public-service">Public Service</option>
                        <option value="administrator">Administrator</option>
                        <option value="student">Student</option>
                        <option value="self-employed">Self Employed</option>
                        <option value="no-occupation">No Occupation</option>
                    </select><br><br>

                    <label for="fav-hobbies">Favorite Hobbies: </label><br>
                    <label for="hobby1">Reading</label>
                    <input type="checkbox" id="hobby" name="hobby1" value="Reading"><br>
                    <label for="hobby2">Drawing</label>
                    <input type="checkbox" id="hobby" name="hobby2" value="Drawing"><br>
                    <label for="hobby3">Shopping</label>
                    <input type="checkbox" id="hobby" name="hobby3" value="Shopping"><br>
                    <label for="hobby4">Photography</label>
                    <input type="checkbox" id="hobby" name="hobby4" value="Photography"><br>
                    <label for="hobby5">Social Media</label>
                    <input type="checkbox" id="hobby" name="hobby1" value="Social Media"><br><br>

                    <input type="submit" value="Submit">
                </form>
            </div>
        </body>
